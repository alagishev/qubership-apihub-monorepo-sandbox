name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "docs/**"
      - "helm-templates/**"
      - "docker-compose/**"
      - "agent-packages/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      bazel_targets: ${{ steps.detect.outputs.bazel_targets }}
      modules: ${{ steps.detect.outputs.modules }}
      oci_push_targets: ${{ steps.detect.outputs.oci_push_targets }}
      feature_tag: ${{ steps.detect.outputs.feature_tag }}
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
      needs_npm: ${{ steps.detect.outputs.needs_npm }}
      needs_go: ${{ steps.detect.outputs.needs_go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install detect dependencies
        run: pip install --user pyyaml

      - name: Detect affected targets
        id: detect
        env:
          FEATURE_TAG: ${{ github.event_name == 'pull_request' && format('pull-{0}-merge', github.event.number) || '' }}
          GITHUB_EVENT_NUMBER: ${{ github.event.number }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git merge-base HEAD origin/develop 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1)"
          fi
          JSON="$(bash tools/ci/detect-affected.sh "$BASE" HEAD)"
          echo "$JSON" | tee affected.json
          echo "bazel_targets=$(echo "$JSON" | jq -c '.bazel_targets')" >> "$GITHUB_OUTPUT"
          echo "modules=$(echo "$JSON" | jq -c '.modules')" >> "$GITHUB_OUTPUT"
          echo "oci_push_targets=$(echo "$JSON" | jq -c '.oci_push_targets')" >> "$GITHUB_OUTPUT"
          FT="$(bash tools/ci/feature_tag.sh)"
          echo "feature_tag=$FT" >> "$GITHUB_OUTPUT"
          MOD_COUNT="$(echo "$JSON" | jq '.modules | length')"
          if [[ "$MOD_COUNT" -gt 0 ]]; then echo "run_e2e=true" >> "$GITHUB_OUTPUT"; else echo "run_e2e=false" >> "$GITHUB_OUTPUT"; fi
          NEEDS_NPM="$(python3 - <<'PY'
          import json, yaml
          mods = json.load(open("affected.json"))["modules"]
          cfg = yaml.safe_load(open("tools/modules.yaml"))["modules"]
          kinds = {cfg[m]["kind"] for m in mods if m in cfg}
          print("true" if any(k.startswith("npm") for k in kinds) else "false")
          PY
          )"
          NEEDS_GO="$(python3 - <<'PY'
          import json, yaml
          mods = json.load(open("affected.json"))["modules"]
          cfg = yaml.safe_load(open("tools/modules.yaml"))["modules"]
          kinds = {cfg[m]["kind"] for m in mods if m in cfg}
          print("true" if any(k.startswith("go") for k in kinds) else "false")
          PY
          )"
          echo "needs_npm=$NEEDS_NPM" >> "$GITHUB_OUTPUT"
          echo "needs_go=$NEEDS_GO" >> "$GITHUB_OUTPUT"

  bazel-test:
    needs: detect-affected
    if: needs.detect-affected.outputs.bazel_targets != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.x

      - uses: actions/setup-go@v5
        if: needs.detect-affected.outputs.needs_go == 'true'
        with:
          go-version: "1.26.5"

      - uses: pnpm/action-setup@v6
        if: needs.detect-affected.outputs.needs_npm == 'true'

      - uses: actions/setup-node@v4
        if: needs.detect-affected.outputs.needs_npm == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: pnpm install
        if: needs.detect-affected.outputs.needs_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm install --frozen-lockfile

      - name: Bazel test Go libraries
        if: needs.detect-affected.outputs.needs_go == 'true'
        run: |
          TARGETS='${{ needs.detect-affected.outputs.bazel_targets }}'
          LIBS=$(echo "$TARGETS" | jq -r '.[] | select(test("commons-go"))')
          if [[ -n "$LIBS" ]]; then
            bazel test --config=ci --config=go-only --test_output=errors $LIBS
          else
            echo "No commons-go targets in this change; skip Go library tests."
          fi

      - name: Bazel build Go service binaries
        if: needs.detect-affected.outputs.needs_go == 'true'
        run: |
          MODULES='${{ needs.detect-affected.outputs.modules }}'
          TARGETS=()
          echo "$MODULES" | jq -e 'index("backend")' >/dev/null && TARGETS+=("//qubership-apihub-backend/qubership-apihub-service:qubership-apihub-service")
          echo "$MODULES" | jq -e 'index("linter")' >/dev/null && TARGETS+=("//qubership-api-linter-service/qubership-api-linter-service:qubership-api-linter-service")
          echo "$MODULES" | jq -e 'index("agents-backend")' >/dev/null && TARGETS+=("//qubership-apihub-agents-backend/qubership-apihub-agents-backend:qubership-apihub-agents-backend")
          if [[ ${#TARGETS[@]} -gt 0 ]]; then
            bazel build --config=ci --config=go-only "${TARGETS[@]}"
          else
            echo "No Go service modules in this change; skip binary builds."
          fi

      - name: Go compile cascade (go.work dependents)
        if: needs.detect-affected.outputs.needs_go == 'true'
        run: |
          MODULES='${{ needs.detect-affected.outputs.modules }}'
          python3 tools/ci/go_work_compile.py "$MODULES"

      - name: Build affected npm packages
        if: needs.detect-affected.outputs.needs_npm == 'true'
        run: |
          MODULES='${{ needs.detect-affected.outputs.modules }}'
          # Trailing "..." tells pnpm to build workspace dependencies first.
          echo "$MODULES" | jq -e 'index("api-diff")' >/dev/null && \
            pnpm --filter "@netcracker/qubership-apihub-api-diff..." run build
          echo "$MODULES" | jq -e 'index("api-processor")' >/dev/null && \
            pnpm --filter "@netcracker/qubership-apihub-api-processor..." run build
          echo "$MODULES" | jq -e 'index("build-task-consumer")' >/dev/null && \
            pnpm --filter "@netcracker/qubership-apihub-build-task-consumer..." run build
          echo "$MODULES" | jq -e 'index("ui")' >/dev/null && \
            pnpm --filter "@netcracker/qubership-apihub-ui..." run build

  bazel-build-push:
    needs: [detect-affected, bazel-test]
    if: |
      always() &&
      needs.detect-affected.outputs.oci_push_targets != '[]' &&
      (needs.bazel-test.result == 'success' || needs.bazel-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.x

      - uses: actions/setup-go@v5
        if: needs.detect-affected.outputs.needs_go == 'true'
        with:
          go-version: "1.26.5"

      - uses: pnpm/action-setup@v6
        if: needs.detect-affected.outputs.needs_npm == 'true'

      - uses: actions/setup-node@v4
        if: needs.detect-affected.outputs.needs_npm == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: pnpm install (for npm image builds)
        if: needs.detect-affected.outputs.needs_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          # Dockerfile.local for BTC copies package .npmrc into the image for npm ci.
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> \
            qubership-apihub-build-task-consumer/.npmrc
          pnpm install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI images
        env:
          TAG: ${{ needs.detect-affected.outputs.feature_tag }}
          OWNER: ${{ github.repository_owner }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGETS='${{ needs.detect-affected.outputs.oci_push_targets }}'
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for target in $(echo "$TARGETS" | jq -r '.[]'); do
            case "$target" in
              docker:build-task-consumer)
                bash tools/ci/docker_push_npm.sh build-task-consumer \
                  "ghcr.io/${OWNER_LC}/qubership-apihub-build-task-consumer" "$TAG"
                ;;
              docker:ui)
                bash tools/ci/docker_push_npm.sh ui \
                  "ghcr.io/${OWNER_LC}/qubership-apihub-ui" "$TAG"
                ;;
              *apihub-backend*)
                bazel run --config=ci --config=go-only "$target" -- \
                  --repository "ghcr.io/${OWNER_LC}/qubership-apihub-backend" --tag "$TAG"
                ;;
              *api-linter*)
                bazel run --config=ci --config=go-only "$target" -- \
                  --repository "ghcr.io/${OWNER_LC}/qubership-api-linter-service" --tag "$TAG"
                ;;
              *agents-backend*)
                bazel run --config=ci --config=go-only "$target" -- \
                  --repository "ghcr.io/${OWNER_LC}/qubership-apihub-agents-backend" --tag "$TAG"
                ;;
              *)
                echo "Unknown push target: $target"
                exit 1
                ;;
            esac
          done

  e2e:
    needs: [detect-affected, bazel-build-push]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-affected.outputs.run_e2e == 'true' &&
      needs.bazel-build-push.result == 'success'
    uses: ./.github/workflows/run-e2e-monorepo.yml
    with:
      compose-repository-url: https://github.com/${{ github.repository }}.git
      compose-repository-branch: ${{ github.head_ref }}
      compose-repository-compose-folder: docker-compose/apihub-generic
      ghcr-owner: ${{ github.repository_owner }}
      postman-repository-url: https://github.com/${{ github.repository }}.git
      postman-repository-branch: ${{ github.head_ref }}
      postman-subdirectory: qubership-apihub-postman-collections
      postman-collections-list: ./e2e/1_1_Smoke_Portal.postman_collection.json,./e2e/1_3_Linter_Portal.postman_collection.json
      apihub-backend-image-tag: ${{ contains(fromJson(needs.detect-affected.outputs.modules), 'backend') && needs.detect-affected.outputs.feature_tag || 'dev' }}
      apihub-build-task-consumer-image-tag: ${{ contains(fromJson(needs.detect-affected.outputs.modules), 'build-task-consumer') && needs.detect-affected.outputs.feature_tag || 'dev' }}
      apihub-ui-image-tag: ${{ contains(fromJson(needs.detect-affected.outputs.modules), 'ui') && needs.detect-affected.outputs.feature_tag || 'dev' }}
      apihub-api-linter-service-image-tag: ${{ contains(fromJson(needs.detect-affected.outputs.modules), 'linter') && needs.detect-affected.outputs.feature_tag || 'dev' }}
      apihub-agents-backend-image-tag: ${{ contains(fromJson(needs.detect-affected.outputs.modules), 'agents-backend') && needs.detect-affected.outputs.feature_tag || 'dev' }}
      playwright-repository-branch: main
    secrets:
      APIHUB_ACCESS_TOKEN: ${{ secrets.APIHUB_ACCESS_TOKEN }}
      APIHUB_ADMIN_EMAIL: ${{ secrets.APIHUB_ADMIN_EMAIL }}
      APIHUB_ADMIN_PASSWORD: ${{ secrets.APIHUB_ADMIN_PASSWORD }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
