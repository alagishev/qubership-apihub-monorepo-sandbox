name: Release

on:
  workflow_call:
    inputs:
      module_id:
        description: Module ID from tools/modules.yaml
        required: true
        type: string
      version:
        description: Semantic version without a leading v
        required: true
        type: string
  push:
    tags:
      - "commons-go/v*"
      - "backend/v*"
      - "linter/v*"
      - "agents-backend/v*"
      - "api-diff/v*"
      - "api-processor/v*"
      - "build-task-consumer/v*"
      - "ui/v*"

permissions:
  contents: write
  packages: write

jobs:
  parse-tag:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      module_id: ${{ steps.parse.outputs.module_id }}
      version: ${{ steps.parse.outputs.version }}
      kind: ${{ steps.parse.outputs.kind }}
      oci_push: ${{ steps.parse.outputs.oci_push }}
      tag_name: ${{ steps.parse.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        env:
          # Called workflows keep the caller's event_name (e.g. workflow_dispatch),
          # so detect reusable-call mode by whether module/version inputs are set.
          INPUT_MODULE: ${{ inputs.module_id }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pip install pyyaml -q
          if [[ -n "$INPUT_MODULE" && -n "$INPUT_VERSION" ]]; then
            MODULE="$INPUT_MODULE"
            VERSION="$INPUT_VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            MODULE="${TAG%%/*}"
            VERSION="${TAG#*/}"
            VERSION="${VERSION#v}"
          fi
          echo "module_id=$MODULE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=${MODULE}/v${VERSION}" >> "$GITHUB_OUTPUT"
          KIND="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/modules.yaml'))['modules']['${MODULE}']['kind'])")"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          OCI="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/modules.yaml'))['modules']['${MODULE}'].get('oci_push',''))")"
          echo "oci_push=$OCI" >> "$GITHUB_OUTPUT"

  release:
    needs: parse-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.x

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test module
        run: |
          MODULE="${{ needs.parse-tag.outputs.module_id }}"
          TARGET="$(python3 -c "import yaml; m=yaml.safe_load(open('tools/modules.yaml'))['modules']['$MODULE']; print(m['bazel'])")"
          bazel test --config=ci "$TARGET"

      - name: Go library release tarball
        if: needs.parse-tag.outputs.kind == 'go-lib'
        run: |
          MODULE="${{ needs.parse-tag.outputs.module_id }}"
          TAG_NAME="${{ needs.parse-tag.outputs.tag_name }}"
          PATH_DIR="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/modules.yaml'))['modules']['$MODULE']['path'])")"
          mkdir -p artifacts
          tar -czf "artifacts/qubership-apihub-${MODULE}-${TAG_NAME}.tar.gz" \
            --exclude='.git' --exclude='bazel-*' -C "$PATH_DIR" .

      - name: Publish npm package
        if: contains(fromJson('["npm-lib","npm-service","npm-ui"]'), needs.parse-tag.outputs.kind)
        run: |
          MODULE="${{ needs.parse-tag.outputs.module_id }}"
          case "$MODULE" in
            api-diff) pnpm --filter "@netcracker/qubership-apihub-api-diff" run build ;;
            api-processor) pnpm --filter "@netcracker/qubership-apihub-api-processor" run build ;;
            build-task-consumer) pnpm --filter "@netcracker/qubership-apihub-build-task-consumer" run build ;;
            ui) pnpm --filter "@netcracker/qubership-apihub-ui" run build ;;
          esac
          PATH_DIR="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/modules.yaml'))['modules']['$MODULE']['path'])")"
          cd "$PATH_DIR"
          npm publish --access restricted --tag "v${{ needs.parse-tag.outputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.parse-tag.outputs.oci_push != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image
        if: needs.parse-tag.outputs.oci_push != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ needs.parse-tag.outputs.module_id }}"
          OCI="${{ needs.parse-tag.outputs.oci_push }}"
          VERSION="v${{ needs.parse-tag.outputs.version }}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          case "$OCI" in
            docker:build-task-consumer)
              echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> \
                qubership-apihub-build-task-consumer/.npmrc
              bash tools/ci/docker_push_npm.sh build-task-consumer \
                "ghcr.io/${OWNER_LC}/qubership-apihub-build-task-consumer" "$VERSION"
              ;;
            docker:ui)
              bash tools/ci/docker_push_npm.sh ui \
                "ghcr.io/${OWNER_LC}/qubership-apihub-ui" "$VERSION"
              ;;
            *)
              bazel run --config=release "$OCI" -- --tag "$VERSION"
              ;;
          esac

      - name: Download generated module release notes
        if: inputs.module_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: module-release-notes
          path: module-notes

      - name: Prepare release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pyyaml -q
          MODULE="${{ needs.parse-tag.outputs.module_id }}"
          TAG_NAME="${{ needs.parse-tag.outputs.tag_name }}"
          VERSION="${{ needs.parse-tag.outputs.version }}"
          if [[ -f "module-notes/${MODULE}.md" ]]; then
            cp "module-notes/${MODULE}.md" release-notes.md
          else
            PATH_DIR="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/modules.yaml'))['modules']['$MODULE']['path'])")"
            IMAGE="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/modules.yaml'))['modules']['$MODULE'].get('image') or '')")"
            python3 -m tools.ci.generate_component_release_notes \
              --module-id "$MODULE" \
              --next-tag "$TAG_NAME" \
              --module-path "$PATH_DIR" \
              --version "$VERSION" \
              --image "$IMAGE" \
              --output release-notes.md
          fi

      - name: GitHub Release (go-lib tarball)
        if: needs.parse-tag.outputs.kind == 'go-lib'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.parse-tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body_path: release-notes.md

      - name: GitHub Release
        if: needs.parse-tag.outputs.kind != 'go-lib'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.parse-tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
