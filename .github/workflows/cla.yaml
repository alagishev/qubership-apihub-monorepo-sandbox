---
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  CLAAssistant:
    if: github.event.pull_request.draft == false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Skip when CLA_ACCESS_TOKEN is not configured
        id: gate
        env:
          CLA_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        run: |
          if [[ -z "${CLA_ACCESS_TOKEN}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLA_ACCESS_TOKEN is not set; skipping CLA check (sandbox/fork)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "CLA Assistant"
        if: |
          steps.gate.outputs.skip != 'true' &&
          ((github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Netcracker/qubership-github-workflows/blob/main/CLA/cla.md'
          # branch should not be protected
          branch: 'main'
          allowlist: NetcrackerCLPLCI,web-flow,bot*
          remote-repository-name: cla-storage
          remote-organization-name: Netcracker
